<title>The Crew</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>

/* Layout: the Mission Control space look, committed dark. The bridge is the page: a wide deck with the
   viewscreen across the back wall, eight console berths in two rows and the command dais in the middle.
   The crew are small and mostly at their posts. The crew's numbers and the relay feed follow below. */
:root{
  --void:#0c0510; --glass:rgba(34,16,38,.72); --line:rgba(253,245,252,.13); --line-2:rgba(253,245,252,.24);
  --star:#fdf5fc; --mute:rgba(253,245,252,.68); --faint:rgba(253,245,252,.44);
  --orchid:#d9a6dc; --cognac:#d5a56a; --live:#a9cb8e; --watch:#f1c95c;
  --desk:#2a142f; --desk-top:#45224c; --screen:#120914;
  --serif:"GascogneSerial-Light",Georgia,serif; --sans:"Geist",-apple-system,"Segoe UI",sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--star);font:14px/1.5 var(--sans);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60vmax 40vmax at 50% 0%,rgba(108,29,114,.45),transparent 70%),radial-gradient(50vmax 30vmax at 50% 100%,rgba(213,165,106,.10),transparent 70%)}
a{color:var(--orchid)}
:focus-visible{outline:2px solid var(--cognac);outline-offset:2px}
main{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;display:grid;gap:22px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.hub{color:var(--mute);text-decoration:none;font:500 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.hub:hover{color:var(--cognac)}
.top h1{margin:0;font:400 clamp(34px,6vw,54px)/1 var(--serif);letter-spacing:-.01em;flex-basis:100%}
.lede{margin:0;color:var(--mute);max-width:70ch}
.asof{color:var(--mute);font:500 12.5px var(--mono)}

.scene-wrap{overflow-x:auto;border-radius:22px;border:1px solid var(--line);background:#0e0612}
.scene{position:relative;min-width:820px;aspect-ratio:1600/840}
.scene canvas{position:absolute;left:23.75%;top:4.048%;width:52.5%;height:31.667%;border-radius:1.4%/3.6%;display:block}
.scene svg.stage{position:absolute;inset:0;width:100%;height:100%}
.sm{--surface:#fdf5fc;--ink:#221820;--cheek:#e79bb4;--muted:#cdb9d1;--font-sans:var(--sans)}
.lbl{font:500 11px var(--mono);letter-spacing:.18em;fill:var(--cognac)}
.lbl.dim{fill:var(--faint)}
.tag{font:500 11px var(--sans);fill:var(--mute);paint-order:stroke;stroke:#0e0612;stroke-width:3px;stroke-linejoin:round}
.ticker{font:500 19px var(--mono);letter-spacing:.03em;fill:var(--star)}
.ticker2{font:500 14px var(--mono);fill:var(--mute)}
.ticker-k{font:500 12px var(--mono);letter-spacing:.2em;fill:var(--cognac)}
.bar{transform-box:fill-box;transform-origin:0 50%;animation:type var(--type,1.2s) steps(4) infinite}
@keyframes type{0%{transform:scaleX(.25)}50%{transform:scaleX(1)}100%{transform:scaleX(.55)}}
.idle .bar{animation:none;transform:scaleX(.4);opacity:.35}
.ring{transform-box:fill-box;transform-origin:50% 50%;animation:ring 3.2s ease-out infinite}
@keyframes ring{0%{transform:scale(.4);opacity:.8}100%{transform:scale(2.4);opacity:0}}
.blink{animation:blink var(--b,3s) ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:.85}}
/* Wash's dinosaurs: they hop, face off and bump while he has nothing to fly. */
.dino{transform-box:fill-box;transform-origin:50% 100%}
.dino.a{animation:dinoA 3.4s ease-in-out infinite}.dino.b{animation:dinoB 3.4s ease-in-out infinite}
@keyframes dinoA{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-6px,-10px) rotate(-8deg)}40%{transform:translate(-14px,0) rotate(0)}55%{transform:translate(-16px,-4px) rotate(-14deg)}70%{transform:translate(-8px,0)}}
@keyframes dinoB{0%,100%{transform:translate(0,0)}30%{transform:translate(8px,-8px) rotate(6deg)}50%{transform:translate(14px,0)}60%{transform:translate(16px,-3px) rotate(10deg)}80%{transform:translate(6px,0)}}
@media (prefers-reduced-motion:reduce){.bar,.ring,.blink,.dino{animation:none}}
/* Opening: the ship flies in through space, the camera closes on its door, the door opens onto the deck. */
#intro{position:fixed;inset:0;z-index:50;background:#05020a;transition:opacity .45s ease}
#intro.clear{background:transparent}#intro.gone{opacity:0;pointer-events:none}
#intro canvas,#intro svg{position:absolute;inset:0;width:100%;height:100%}
/* Red alert: the deck goes dark red and pulses while the crew run to their stations. */
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(80% 70% at 50% 60%,rgba(255,40,50,.0),rgba(120,0,10,.0));transition:background .6s}
.scene.alert::after{background:radial-gradient(80% 70% at 50% 60%,rgba(255,40,50,.10),rgba(90,0,10,.55));animation:alertPulse 1.1s ease-in-out infinite}
@keyframes alertPulse{0%,100%{opacity:.65}50%{opacity:1}}
.scene.alert svg.stage .blink{fill:#ff4d4d;animation-duration:.55s}
.scene.alert .ticker,.scene.alert .ticker-k{fill:#ff8a8a}
#skip{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  border:1px solid var(--line-2);background:rgba(12,5,16,.6);color:var(--star);border-radius:999px;padding:5px 14px;font:500 12px var(--mono);letter-spacing:.12em;cursor:pointer}
#skip:hover{border-color:var(--cognac);color:var(--cognac)}
.replay{border:0;background:none;color:var(--mute);font:500 12px var(--mono);text-decoration:underline;cursor:pointer;padding:0}
.replay:hover{color:var(--cognac)}

h2{margin:0 0 10px;font:400 22px/1.2 var(--serif)}
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mem{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--glass);display:grid;gap:4px;align-content:start;min-width:0}
.mem.open{border-style:dashed;opacity:.75}
.mem .k{font:500 10.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--cognac)}
.mem h3{margin:0;font:400 22px/1.15 var(--serif)}
.mem p{margin:0;color:var(--mute);font-size:13px}
.nums{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px var(--mono);color:var(--mute);margin-top:4px}
.nums b{color:var(--star);font-weight:500}
.chip{font:500 11px var(--mono);letter-spacing:.06em;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--mute);justify-self:start}
.chip.live{color:var(--live);border-color:rgba(169,203,142,.45)}.chip.cand{color:var(--live);border-color:var(--live);font-weight:700}.nums .bar{flex-basis:100%;color:var(--mute)}.chip.test{color:var(--watch);border-color:rgba(241,201,92,.45)}
.feed{list-style:none;margin:0;padding:0;display:grid;border:1px solid var(--line);border-radius:14px;background:var(--glass);overflow:hidden}
.feed li{display:grid;grid-template-columns:110px 14px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 14px;border-top:1px solid var(--line);font-size:13.5px}
.feed li:first-child{border-top:0}
.feed time{font:500 12px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
.feed .dot{width:9px;height:9px;border-radius:50%;align-self:center}
.feed .who{color:var(--star)}.feed .what{color:var(--mute)}
.feed .to{font:500 12px var(--mono);color:var(--mute);white-space:nowrap}
.empty{padding:14px;color:var(--mute)}
footer{color:var(--faint);font-size:12.5px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:560px){.feed li{grid-template-columns:14px minmax(0,1fr)}.feed time,.feed .to{grid-column:2}}
.feed li{grid-template-columns:14px minmax(0,1fr) auto}
</style>

(--plum)\" />\n    <path d=\"M68 106 Q80 112 92 106\" stroke=\"var(--surface)\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\" />\n    <path d=\"M108 106 Q120 112 132 106\" stroke=\"var(--surface)\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\" />\n    <path d=\"M90 134 Q100 140 110 134\" stroke=\"var(--surface)\" stroke-width=\"5\" stroke-linecap=\"round\" fill=\"none\" />\n    <text x=\"150\" y=\"44\" font-family=\"var(--font-sans)\" font-weight=\"700\" font-size=\"26\" fill=\"var(--muted)\">z<\/text>\n    <text x=\"166\" y=\"28\" font-family=\"var(--font-sans)\" font-weight=\"700\" font-size=\"18\" fill=\"var(--muted)\">z<\/text><g transform=\"translate(0 8)\"><path d=\"M50 74 Q100 60 150 74\" stroke=\"#e6e6e6\" stroke-width=\"5\" fill=\"none\"/>\n<circle cx=\"100\" cy=\"62\" r=\"13\" fill=\"#dfe7ec\" stroke=\"#9aa6ad\" stroke-width=\"3\"/><circle cx=\"100\" cy=\"62\" r=\"4\" fill=\"#1c1123\"/>\n<path d=\"M72 132 Q72 160 100 160 Q128 160 128 132\" stroke=\"#2a2a2e\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/>\n<circle cx=\"100\" cy=\"160\" r=\"6\" fill=\"#c9cfd3\" stroke=\"#2a2a2e\" stroke-width=\"3\"/>\n<rect x=\"138\" y=\"140\" width=\"18\" height=\"18\" rx=\"3\" fill=\"#ffffff\"/><path d=\"M147 143 V155 M141 149 H153\" stroke=\"#d64545\" stroke-width=\"4\"/><\/g><\/svg>"},"sends7":0,"sends24":0,"last":null}],"feed":[{"t":"","by":"Beacon","what":"Answered a help-chat question","n":1,"to":"help chat"},{"t":"","by":"Gunny","what":"Sent the morning case card","n":1,"to":"DM"},{"t":"","by":"Chopper","what":"Drafted renewal ACORDs","n":1,"to":"DM"},{"t":"","by":"Sparks","what":"Refreshed Queue Commander","n":1,"to":"page"},{"t":"","by":"Captain Steadman","what":"Posted the daily summary","n":1,"to":"channel"},{"t":"","by":"Fido","what":"Checked a number before a page used it","n":1,"to":"session"}]};
(()=>{
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NS="http://www.w3.org/2000/svg",RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const ST={live:["live","Live"],testing:["test","Testing"],planned:["","Test soon"],reserved:["","Reserved"],open:["","Open post"]};
const ago=iso=>{if(!iso)return"none in 7 days";const h=(Date.now()-Date.parse(iso))/36e5;return h<1?"under an hour ago":h<48?Math.round(h)+" h ago":Math.round(h/24)+" days ago"};
const when=iso=>new Date(iso).toLocaleString("en-US",{timeZone:"America/Chicago",weekday:"short",hour:"numeric",minute:"2-digit"});
const rnd=(lo,hi)=>lo+Math.random()*(hi-lo);
$("#asof").textContent="Examples, not live";

// ---- The deck. Berths fill the back row first; a new station takes the next free berth.
const BERTHS=[[330,478],[575,478],[1025,478],[1270,478],[235,736],[505,736],[1095,736],[1365,736]];
const DAIS={x:800,y:640},SCREEN_Y=300;
const depth=y=>0.72+(y-360)/480*0.42;
const cap=D.crew.find(m=>m.station==="command"),posts=D.crew.filter(m=>m!==cap);
const working=m=>m&&(m.sends7>0||m.checks24>0);  // Engineering works while its checks run

let wall=`<defs>
  <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1531"/><stop offset="1" stop-color="#0e0612"/></linearGradient>
  <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e0d23"/><stop offset="1" stop-color="#170a1b"/></linearGradient>
  <radialGradient id="gDais" cx="50%" cy="40%"><stop offset="0" stop-color="#5a2b5f"/><stop offset="1" stop-color="#25112a"/></radialGradient>
  <clipPath id="cFloor"><path d="M0 360 H1600 V840 H0 Z"/></clipPath>
</defs>
<path fill-rule="evenodd" fill="url(#gWall)" d="M0 0 H1600 V360 H0 Z M398 34 H1202 A18 18 0 0 1 1220 52 V282 A18 18 0 0 1 1202 300 H398 A18 18 0 0 1 380 282 V52 A18 18 0 0 1 398 34 Z"/>
<g fill="rgba(253,245,252,.05)">${Array.from({length:15},(_,i)=>`<rect x="${70+i*100}" y="6" width="56" height="5" rx="2.5"/>`).join("")}</g>
<path d="M0 30 L300 60 V340 L0 360 Z M1600 30 L1300 60 V340 L1600 360 Z" fill="rgba(253,245,252,.025)" stroke="rgba(253,245,252,.07)"/>`;
// Side-wall panels with indicator lights.
[[40,1],[1460,-1]].forEach(([x0,dir])=>{for(let r=0;r<5;r++)for(let c=0;c<6;c++){const x=x0+dir*(c*36)+(dir<0?100:0),y=110+r*40;
  const on=Math.random()<.35,col=["#a9cb8e","#d5a56a","#d9a6dc","#f0a092"][Math.floor(Math.random()*4)];
  wall+=`<rect x="${x}" y="${y}" width="22" height="8" rx="2" fill="${on?col:"rgba(253,245,252,.08)"}" ${on?`class="blink" style="--b:${rnd(2.5,7).toFixed(1)}s;animation-delay:-${rnd(0,6).toFixed(1)}s"`:""}/>`}});
wall+=`<rect x="380" y="34" width="840" height="266" rx="18" fill="none" stroke="rgba(213,165,106,.6)" stroke-width="2.5"/>
<rect x="368" y="22" width="864" height="290" rx="26" fill="none" stroke="rgba(253,245,252,.10)" stroke-width="10"/>
<text class="ticker-k" x="410" y="68">VIEWSCREEN · SLACK</text>
<text class="ticker-k" id="tkK" x="410" y="228">ON THE WIRE</text>
<text class="ticker" id="tk" x="410" y="256"></text>
<text class="ticker2" id="tk2" x="410" y="280"></text>
<path d="M0 360 H1600 V840 H0 Z" fill="url(#gFloor)"/>
<g clip-path="url(#cFloor)" stroke="rgba(213,165,106,.07)" stroke-width="1.2" fill="none">
  ${Array.from({length:15},(_,i)=>`<path d="M800 150 L${-600+i*200} 840"/>`).join("")}
  ${[400,460,540,640,760].map(y=>`<path d="M0 ${y} H1600"/>`).join("")}
</g>
<path d="M420 386 H1180 L1200 416 H400 Z" fill="var(--desk)" stroke="rgba(253,245,252,.10)"/>
<g>${Array.from({length:18},(_,i)=>`<rect x="${436+i*41}" y="${394}" width="26" height="6" rx="2" fill="${["#d5a56a","#d9a6dc","#a9cb8e"][i%3]}" opacity=".5" class="blink" style="--b:${rnd(3,8).toFixed(1)}s;animation-delay:-${rnd(0,6).toFixed(1)}s"/>`).join("")}</g>
<text class="lbl" x="800" y="484" text-anchor="middle">HELM</text>
<g fill="#1a0b1e" stroke="rgba(213,165,106,.35)" stroke-width="2"><rect x="108" y="228" width="84" height="132" rx="8"/><rect x="1408" y="228" width="84" height="132" rx="8"/></g>
<g id="doorL"><rect class="dl" x="112" y="232" width="38" height="126" fill="#3a1d40"/><rect class="dr" x="150" y="232" width="38" height="126" fill="#3a1d40"/></g>
<g id="doorR"><rect class="dl" x="1412" y="232" width="38" height="126" fill="#3a1d40"/><rect class="dr" x="1450" y="232" width="38" height="126" fill="#3a1d40"/></g>
<g id="beams"></g><g id="world"></g>`;
const stage=$("#stage");stage.innerHTML=wall;
const world=$("#world"),beams=$("#beams");
const el=(tag,attrs,html)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(html!=null)e.innerHTML=html;return e};
const items=[];
const add=(g,y)=>{g.__y=y;items.push(g);world.appendChild(g);return g};

// Command dais, railing and chair.
add(el("g",{transform:`translate(${DAIS.x},${DAIS.y}) scale(${depth(DAIS.y)})`},`<ellipse cx="0" cy="6" rx="170" ry="38" fill="url(#gDais)" stroke="rgba(213,165,106,.4)"/>
  <path d="M-170 6 A170 38 0 0 1 170 6" fill="none" stroke="rgba(213,165,106,.35)" stroke-width="3" transform="translate(0,-26)"/>
  <text class="lbl" x="0" y="70" text-anchor="middle">COMMAND</text>`),DAIS.y-70);
add(el("g",{transform:`translate(${DAIS.x},${DAIS.y-24}) scale(${depth(DAIS.y)})`},`<path d="M-46 0 V-96 q0 -18 18 -18 h56 q18 0 18 18 V0 Z" fill="#2c1531" stroke="rgba(253,245,252,.12)"/>`),DAIS.y-26);

// Consoles in every berth.
// The pilot flies from the forward helm console under the viewscreen; every other station takes a berth.
const HELM={x:800,y:452},berthed=posts.filter(m=>m.station!=="helm");
berthed.forEach((m,i)=>m.berth=BERTHS[i]);
BERTHS.forEach((b,i)=>{const m=berthed[i],open=!m||m.status==="open",s=depth(b[1]);
  let g=`<g class="${working(m)?"":"idle"}"><path d="M-96 -48 H96 L110 0 H-110 Z" fill="var(--desk)" stroke="rgba(253,245,252,.10)"/>
    <path d="M-96 -48 H96 L100 -38 H-100 Z" fill="var(--desk-top)"/>
    <rect x="-72" y="-34" width="144" height="24" rx="4" fill="var(--screen)" stroke="${open?"rgba(253,245,252,.12)":m.color}" stroke-opacity=".75"/>`;
  if(open)g+=`<text class="lbl dim blink" x="0" y="-17" text-anchor="middle" style="font-size:9.5px">${m?"OPEN POST":"SPARE BERTH"}</text>`;
  else[0,1,2].forEach(k=>g+=`<rect class="bar" style="--type:${(0.9+k*.35).toFixed(2)}s;animation-delay:-${k*.3}s" x="-64" y="${-30+k*6.5}" width="${[90,66,110][k]}" height="3.2" rx="1.5" fill="${m.color}"/>`);
  g+=`<text class="lbl${open?" dim":""}" x="0" y="24" text-anchor="middle">${m?E(m.label.toUpperCase()):""}</text></g>`;
  add(el("g",{transform:`translate(${b[0]},${b[1]}) scale(${s})`},g),b[1])});

// ---- Crew. Each has three faces (Steadman's approved moods) and shows one at a time.
const actors=[];
function actor(m,home,size){const g=el("g",{}),flip=el("g",{}),wob=el("g",{}),faces={};
  for(const k of ["steady","thinking","resting"]){const f=el("g",{},m.moods[k].replace('<svg class="sm"',`<svg class="sm" x="${-size/2}" y="${-size*0.9}" width="${size}" height="${size}"`));faces[k]=f;wob.appendChild(f)}
  if(m.idle){const ig=el("g",{},`<svg class="sm" x="${-size/2}" y="${-size*0.9}" width="${size}" height="${size}" viewBox="0 0 200 200" overflow="visible">${m.idle}</svg>`);faces.idle=null;wob.appendChild(ig);m._idleG=ig}
  if(m.kit==="beacon")wob.appendChild(el("circle",{class:"ring",cx:0,cy:-size*0.9+size*0.085,r:size*0.07,fill:"none",stroke:"#ffd23f","stroke-width":2}));
  flip.appendChild(wob);g.appendChild(flip);
  const pk=el("circle",{cx:0,cy:-size*0.5,r:7,fill:m.color,opacity:0});pk.style.filter=`drop-shadow(0 0 6px ${m.color})`;g.appendChild(pk);
  g.appendChild(el("text",{class:"tag",x:0,y:16,"text-anchor":"middle"},E(m.name)));
  const a={m,g,flip,wob,pk,faces,size,x:home.x,y:home.y,home,path:[],speed:80,face:1,phase:Math.random()*6,busy:false,mood:""};
  add(g,a.y);actors.push(a);return a}
const setMood=(a,k)=>{if(a.m._idleG)a.m._idleG.setAttribute("display",k==="steady"&&!a.busy&&!working(a.m)?"inline":"none");
  if(a.mood===k)return;a.mood=k;for(const f in a.faces)a.faces[f]&&a.faces[f].setAttribute("display",f===k?"inline":"none")};
const C=cap?actor(cap,{x:DAIS.x,y:DAIS.y-12},104):null;
const crew=posts.filter(m=>m.status!=="open").map(m=>actor(m,m.station==="helm"?{...HELM}:{x:m.berth[0]+(m.berth[0]<DAIS.x?1:-1)*124*depth(m.berth[1]),y:m.berth[1]+10},86));
const rest=a=>working(a.m)?"thinking":a.m.idle?"steady":"resting";  // a crew member with an idle prop plays instead of napping
actors.forEach(a=>setMood(a,a===C?"steady":rest(a)));

const go=(a,pts,speed)=>{a.path=pts.map(p=>({...p}));a.speed=speed};

// ---- Report to stations: the side doors open, the captain strides in first and the crew run to their posts.
const DOORS={L:{x:150,y:372},R:{x:1450,y:372}};
function doors(open){for(const id of ["doorL","doorR"])for(const r of document.querySelectorAll(`#${id} rect`)){
  r.style.transition="transform .5s ease";r.style.transform=open?`translateX(${r.classList.contains("dl")?-36:36}px)`:"none"}}
function scramble(withCaptain=true){doors(true);const order=[...(withCaptain&&C?[C]:[]),...crew];
  order.forEach((a,i)=>{const d=a.home.x<DAIS.x?DOORS.L:DOORS.R;a.busy=true;a.path=[];a.x=d.x;a.y=d.y;a.g.style.opacity=0;setMood(a,"steady");
    setTimeout(()=>{a.g.style.opacity=1;go(a,[{x:a.home.x,y:Math.max(a.home.y,d.y+30)},{...a.home,then:()=>{a.busy=false;setMood(a,a===C?"steady":rest(a))}}],a===C?380:290)},120+i*230)});
  setTimeout(()=>doors(false),order.length*230+1800);return order.length*230+1400}

// ---- The ticker: the newest relay, then whatever each beam carries.
const tk=$("#tk"),tk2=$("#tk2"),feedBy={},cursor={};D.feed.forEach(f=>(feedBy[f.by]=feedBy[f.by]||[]).push(f));
const put=f=>{tk.textContent=`${f.by} · ${f.what}`;tk2.textContent=f.to};
D.feed.length?put(D.feed[0]):(tk.textContent="No relays in the last 7 days.");
const show=name=>{const fs=feedBy[name];if(!fs)return;put(fs[(cursor[name]=((cursor[name]??-1)+1)%fs.length)])};

// The captain beams a message from the dais up into the viewscreen.
function beam(color,name){if(!C){show(name);return}setMood(C,"thinking");
  const b=el("circle",{r:6,fill:color});b.style.filter=`drop-shadow(0 0 10px ${color})`;beams.appendChild(b);
  const x0=C.x,y0=C.y-C.size*depth(C.y)*0.95,t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/900),e=k*k;b.setAttribute("cx",x0);b.setAttribute("cy",y0-(y0-SCREEN_Y+20)*e);b.setAttribute("r",6*(1-k*.5));
    if(k<1)requestAnimationFrame(f);else{b.remove();show(name);setTimeout(()=>setMood(C,"steady"),700)}})(t0)}
// A crew member walks a message to the captain and back to their post.
function deliver(a){if(a===C){beam(a.m.color,a.m.name);return}
  if(a.busy)return;a.busy=true;setMood(a,"steady");a.pk.setAttribute("opacity",1);
  const side=a.home.x<DAIS.x?-1:1,hand={x:DAIS.x+side*80,y:DAIS.y+14};
  go(a,[{x:a.x,y:a.y+26},{...hand,then:()=>{a.pk.setAttribute("opacity",0);a.pause=0.6;beam(a.m.color,a.m.name)}},
        {x:a.home.x,y:a.home.y+26},{...a.home,then:()=>{a.busy=false;setMood(a,rest(a))}}],120)}

// ---- Life at the posts. Mostly still: working crew stay at the console, idle crew nap and wake.
if(!RM){
  D.crew.filter(working).forEach((m,i)=>{const a=actors.find(x=>x.m===m);if(!a)return;
    if(!m.sends7)return;const every=Math.max(14,Math.min(60,70/Math.sqrt(m.sends7)))*1000;
    const tick=()=>{deliver(a);setTimeout(tick,every*rnd(.75,1.35))};setTimeout(tick,4000+i*5000)});
  crew.filter(a=>!working(a.m)&&!a.m.idle).forEach(a=>{
    const nap=()=>{if(!a.busy)setMood(a,"resting");setTimeout(wake,rnd(22000,45000))};
    const wake=()=>{if(!a.busy){setMood(a,"steady");a.face=Math.random()<.5?-1:1}setTimeout(nap,rnd(7000,14000))};
    setTimeout(Math.random()<.5?wake:nap,rnd(3000,15000))});
  // Now and then someone stretches their legs; the captain looks in on a staffed post.
  const stroll=a=>{if(a.busy||a.path.length)return;a.busy=true;setMood(a,"steady");
    const tgt=a===C&&crew.length?crew[Math.floor(Math.random()*crew.length)]:null;
    const p=tgt?{x:tgt.x+(tgt.x<DAIS.x?60:-60),y:tgt.y+30}:{x:a.home.x+rnd(-110,110),y:a.home.y+rnd(30,90)};
    go(a,[{...p,then:()=>{a.pause=rnd(2.5,5)}},{...a.home,then:()=>{a.busy=false;setMood(a,a===C?"steady":rest(a))}}],60)};
  actors.forEach(a=>{const tick=()=>{stroll(a);setTimeout(tick,rnd(90000,180000))};setTimeout(tick,rnd(30000,120000))});
}

// ---- Frame loop: move, breathe, face the way of travel, keep back-to-front order.
let last=performance.now();
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  for(const a of actors){let moving=false;
    if(a.pause>0)a.pause-=dt;
    else if(a.path.length){const p=a.path[0],dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy),step=a.speed*dt*depth(a.y);
      if(d<=step){a.x=p.x;a.y=p.y;a.path.shift();p.then&&p.then()}else{a.x+=dx/d*step;a.y+=dy/d*step;moving=true;if(Math.abs(dx)>2)a.face=dx<0?-1:1}}
    const busyHands=!moving&&a.mood==="thinking",asleep=a.mood==="resting";
    a.phase+=dt*(moving?9:busyHands?7:asleep?1.1:1.8);
    const bob=moving?Math.abs(Math.sin(a.phase))*5:busyHands?Math.abs(Math.sin(a.phase))*1.2:Math.sin(a.phase)*(asleep?1.6:1),
      tilt=moving?Math.sin(a.phase)*5:asleep?-4+Math.sin(a.phase)*1.5:0;
    a.g.setAttribute("transform",`translate(${a.x.toFixed(1)},${a.y.toFixed(1)}) scale(${depth(a.y).toFixed(3)})`);
    a.flip.setAttribute("transform",`scale(${a.face},1)`);a.wob.setAttribute("transform",`translate(0,${(-bob).toFixed(1)}) rotate(${tilt.toFixed(1)})`);
    a.g.__y=a.y}
  const order=[...items].sort((p,q)=>p.__y-q.__y);
  if(order.some((g,i)=>world.children[i]!==g))order.forEach(g=>world.appendChild(g));
  if(!RM)requestAnimationFrame(frame)}
requestAnimationFrame(frame);

// ---- The opening. The ship flies at the camera, the camera swings alongside, dives into the bridge canopy:
// red alert, the captain alone at the command chair, then all hands to stations. Once per visit, skippable,
// never with reduced motion. The ship art is the approved design (art/ship-front.svg, art/ship-side.svg).
const intro=$("#intro"),icv=$("#introCv"),ix=icv.getContext("2d"),isv=$("#introSvg"),shipF=$("#shipF"),shipS=$("#shipS"),flash=$("#flash");
let iStars=[],iRun=false;
function iSize(){const d=Math.min(2,devicePixelRatio||1);icv.width=innerWidth*d;icv.height=innerHeight*d;ix.setTransform(d,0,0,d,0,0);
  iStars=Array.from({length:320},()=>({x:(Math.random()-.5)*innerWidth*2,y:(Math.random()-.5)*innerHeight*2,z:Math.random()*innerWidth}))}
let lat=[];
function sideStars(speed){const w=innerWidth,h=innerHeight;ix.fillStyle="#05020a";ix.fillRect(0,0,w,h);
  if(!lat.length)lat=Array.from({length:220},()=>({x:Math.random()*w,y:Math.random()*h,d:Math.random()*.9+.1}));
  for(const s of lat){s.x-=speed*s.d;if(s.x<-40){s.x=w+Math.random()*40;s.y=Math.random()*h}
    ix.strokeStyle=`rgba(253,245,252,${(.25+.6*s.d).toFixed(2)})`;ix.lineWidth=1.2*s.d+.4;ix.beginPath();ix.moveTo(s.x,s.y);ix.lineTo(s.x+speed*s.d*2.2,s.y);ix.stroke()}}
function warpStars(speed){const w=innerWidth,h=innerHeight;ix.fillStyle="#05020a";ix.fillRect(0,0,w,h);
  for(const s of iStars){s.z-=speed;if(s.z<1){s.z=w;s.x=(Math.random()-.5)*w*2;s.y=(Math.random()-.5)*h*2}
    const k=w/2/s.z,x=w/2+s.x*k,y=h/2+s.y*k,a=Math.min(1,1.2*(1-s.z/w));ix.strokeStyle=`rgba(253,245,252,${a.toFixed(2)})`;
    ix.lineWidth=1.4;ix.beginPath();ix.moveTo(x,y);ix.lineTo(x+s.x*k*speed*.004,y+s.y*k*speed*.004);ix.stroke()}}
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,lerp=(a,b,k)=>a+(b-a)*k;
const tkK=$("#tkK");
function alertOn(on){$(".scene").classList.toggle("alert",on);
  if(on){tkK.textContent="RED ALERT";tk.textContent="ALL HANDS TO STATIONS";tk2.textContent=""}
  else{tkK.textContent="ON THE WIRE";D.feed.length?put(D.feed[0]):(tk.textContent="No relays in the last 7 days.")}}
function playIntro(){if(RM||iRun)return;iRun=true;intro.hidden=false;intro.classList.remove("gone");iSize();
  actors.forEach(a=>{a.g.style.opacity=0;a.path=[];a.busy=true});doors(false);flash.setAttribute("opacity",0);lat=[];
  const T1=2600,T2=1900,T3=1500,t0=performance.now();let done=false;
  const VB={x:-400,y:-300,w:800,h:600},bw=$("#s-bridge-window").getBBox(),WIN={x:bw.x+bw.width*.6,y:bw.y+bw.height*.32,w:bw.width};  // aim at the glass itself: the canopy is a curved band, so its box centre sits on the hull
  const finish=()=>{if(done)return;done=true;intro.classList.add("gone");setTimeout(()=>{intro.hidden=true;iRun=false},700);
    // inside: dark, red alert, the captain alone at the command chair
    actors.forEach(a=>{a.x=a.home.x;a.y=a.home.y;a.path=[]});if(C){C.g.style.opacity=1;C.busy=false;setMood(C,"thinking")}
    alertOn(true);setTimeout(()=>{const t=scramble(false);setTimeout(()=>{alertOn(false);if(C)setMood(C,"steady")},t+600)},1400)};
  $("#skip").onclick=finish;
  (function step(t){if(done)return;const e=t-t0;
    if(e<T1){const k=e/T1,q=k*k*k,s=lerp(.04,1.6,q)+Math.max(0,k-.86)/.14*6;warpStars(4+20*q);
      // shot 1: head-on; in the last moments it rushes past the camera in a burst of engine light
      shipF.setAttribute("transform",`translate(0 ${lerp(30,0,q)}) scale(${s})`);shipF.setAttribute("opacity",k<.9?Math.min(1,k*4):Math.max(0,1-(k-.9)/.1));
      shipS.setAttribute("opacity",0);flash.setAttribute("opacity",Math.max(0,(k-.88)/.12)*.85)}
    else if(e<T1+T2){const k=(e-T1)/T2,es=1-Math.pow(1-k,3);
      // shot 2 (a cut): tracking alongside; the ship slides in and settles while the stars stream past
      sideStars(lerp(46,14,es));shipF.setAttribute("opacity",0);flash.setAttribute("opacity",Math.max(0,.8-k*7));
      shipS.setAttribute("opacity",1);shipS.setAttribute("transform",`translate(${lerp(-620,0,es)} ${Math.sin(k*3.1)*6}) scale(1.1)`)}
    else if(e<T1+T2+T3){const k=(e-T1-T2)/T3,z=ease(k);sideStars(lerp(14,4,z));shipF.setAttribute("opacity",0);shipS.setAttribute("opacity",1);shipS.setAttribute("transform","scale(1.1)");
      const w=VB.w*Math.pow(WIN.w*1.1*.9/VB.w,z),h=w*.75,cx=lerp(0,WIN.x*1.1,z),cy=lerp(0,WIN.y*1.1,z);
      isv.setAttribute("viewBox",`${cx-w/2} ${cy-h/2} ${w} ${h}`);flash.setAttribute("opacity",Math.max(0,(k-.8)/.2));
      flash.setAttribute("x",cx-w/2);flash.setAttribute("y",cy-h/2);flash.setAttribute("width",w);flash.setAttribute("height",h)}
    else{finish();return}
    requestAnimationFrame(step)})(t0);
  isv.setAttribute("viewBox",`${VB.x} ${VB.y} ${VB.w} ${VB.h}`)}
$("#replay").onclick=playIntro;
let seen=false;try{seen=sessionStorage.getItem("bridge-intro")==="1";sessionStorage.setItem("bridge-intro","1")}catch(e){}
if(!RM&&!seen)playIntro();
if(RM)$("#replay").hidden=true;

// ---- Crew numbers and the feed.
$("#roster").innerHTML=D.crew.map(m=>{const open=m.status==="open",[cls,lab]=ST[m.status]||["",m.status];
  return `<div class="mem${open?" open":""}"><span class="k">${E(m.label)}</span><h3>${E(open?"Open post":m.name)}</h3><p>${E(m.job)}</p>
  <span class="chip ${cls}">${E(lab)}</span>${m.cand?.candidate?` <span class="chip cand">Candidate</span>`:""}</div>`}).join("");
const color=n=>(D.crew.find(m=>m.name===n)||{}).color||"#d5a56a";
$("#feed").innerHTML=D.feed.length?D.feed.map(f=>`<li><span class="dot" style="background:${color(f.by)}"></span>
  <span><span class="who">${E(f.by)}</span> <span class="what">· ${E(f.what)}</span></span><span class="to">${f.n>1?f.n+" × ":""}${E(f.to)}</span></li>`).join(""):`<li class="empty">No relays in the last 7 days.</li>`;

// ---- Viewscreen: stars streaming past.
const cv=$("#sky"),cx=cv.getContext("2d");let stars=[];
function size(){const d=Math.min(2,devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
  stars=Array.from({length:180},()=>({x:(Math.random()-.5)*W,y:(Math.random()-.5)*H,z:Math.random()*W}))}
function draw(){const W=cv.clientWidth,H=cv.clientHeight;cx.fillStyle="#0a0410";cx.fillRect(0,0,W,H);
  const g=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,W/1.4);g.addColorStop(0,"rgba(108,29,114,.35)");g.addColorStop(1,"rgba(0,0,0,0)");cx.fillStyle=g;cx.fillRect(0,0,W,H);
  for(const s of stars){if(!RM){s.z-=1.2;if(s.z<1){s.z=W;s.x=(Math.random()-.5)*W;s.y=(Math.random()-.5)*H}}
    const k=W/2/s.z,x=W/2+s.x*k,y=H/2+s.y*k,r=Math.max(.6,2.2-s.z/W*1.8);
    cx.fillStyle=`rgba(253,245,252,${Math.min(1,.25+1.1*(1-s.z/W)).toFixed(2)})`;cx.beginPath();cx.arc(x,y,r,0,6.283);cx.fill()}}
function loop(){draw();requestAnimationFrame(loop)}
addEventListener("resize",()=>{size();draw()});size();RM?draw():requestAnimationFrame(loop);
})();
</script>
